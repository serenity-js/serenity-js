    .stat-card { padding: var(--space-sm) var(--space-md); display: flex; align-items: center; gap: var(--space-sm); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-sm); }

    .mb-0 { margin-bottom: 0; }
    .mt-md { margin-top: var(--space-md); }
    .pb-0 { padding-bottom: 0; }
    .ml-auto { margin-left: auto; }

    .icon-sm { width: 14px; height: 14px; }
    .icon-xs { width: 12px; height: 12px; flex-shrink: 0; }

    /* ===== Scrollable Containers ===== */
    .scroll-x-hidden {
      overflow-x: auto;
      scrollbar-width: none;
    }
    .scroll-x-hidden::-webkit-scrollbar {
      display: none;
    }

    /* ===== Text Clamping ===== */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
    }

    /* ===== Scroll Fade Indicators ===== */
    .fade-right {
      -webkit-mask-image: linear-gradient(to right, black calc(100% - var(--fade-size, 24px)), transparent);
      mask-image: linear-gradient(to right, black calc(100% - var(--fade-size, 24px)), transparent);
    }
    .fade-left {
      -webkit-mask-image: linear-gradient(to left, black calc(100% - var(--fade-size, 24px)), transparent);
      mask-image: linear-gradient(to left, black calc(100% - var(--fade-size, 24px)), transparent);
    }
    .fade-both {
      -webkit-mask-image: linear-gradient(to right, transparent, black var(--fade-size, 24px), black calc(100% - var(--fade-size, 24px)), transparent);
      mask-image: linear-gradient(to right, transparent, black var(--fade-size, 24px), black calc(100% - var(--fade-size, 24px)), transparent);
    }

    .btn-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: var(--font-lg); padding: 4px; line-height: 1; }
    .historical-banner { display: flex; align-items: center; justify-content: space-between; padding: 10px var(--space-md); margin-bottom: var(--space-md); background: var(--accent-light); border: 1px solid var(--accent); border-radius: var(--radius-sm); font-size: var(--font-md); }
    .historical-banner .link-underline { white-space: nowrap; flex-shrink: 0; }

    @media (max-width: 767px) {
      .historical-banner { font-size: var(--font-sm); padding: var(--space-sm) var(--space-md); }
    }
    .virtual-list { width: 100%; position: relative; }

    /* --- Additional Utilities (Phase 4) --- */
    .mt-xs { margin-top: var(--space-xs); }
    .mt-sm { margin-top: var(--space-sm); }
    .ml-sm { margin-left: var(--space-sm); }
    .ml-lg { margin-left: var(--space-lg); }
    .px-md { padding-left: var(--space-md); padding-right: var(--space-md); }
    .py-sm { padding-top: var(--space-sm); padding-bottom: var(--space-sm); }

    .overflow-x { overflow-x: auto; }
    .border-b { border-bottom: 1px solid var(--border-color); }
    .bordered { border: 1px solid var(--border-color); border-radius: var(--radius-sm); overflow: hidden; }

    .panel-bg { padding: var(--space-md); background: var(--bg-primary); border-radius: var(--radius-sm); }
    .panel-section { padding: var(--space-sm) var(--space-md); }
    .panel-section-border { padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--border-color); }
    .panel-header { padding: var(--space-sm) var(--space-md); background: var(--bg-primary); cursor: pointer; user-select: none; }

    .section-title-sm { margin: 0 0 var(--space-xs); font-weight: 600; }
    .section-text { margin: 0; font-size: var(--font-sm); color: var(--text-secondary); }
    .section-label { font-weight: 500; margin-bottom: 4px; }
    .code-block { font-family: var(--font-mono); font-size: var(--font-xs); white-space: pre-wrap; margin: 0; color: var(--text-secondary); }
    .pre-block { font-size: var(--font-sm); font-family: var(--font-mono); background: var(--bg-primary); padding: var(--space-sm) var(--space-md); border-radius: var(--radius-sm); border: 1px solid var(--border-color); white-space: pre-wrap; margin: 0; }

    .expand-chevron { font-size: var(--font-sm); transition: transform 0.2s; }
    .expand-chevron.open { transform: rotate(90deg); }

    .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 2px; display: flex; opacity: 0.6; }
    .icon-btn-sm { background: none; border: none; cursor: pointer; color: var(--text-secondary); padding: 2px 4px; font-size: var(--font-sm); opacity: 0.7; }
    .copy-btn { flex-shrink: 0; width: 28px; height: 28px; border-radius: var(--radius-sm); border: none; background: var(--bg-hover); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .copy-location { cursor: pointer; opacity: 0.6; display: inline-flex; align-items: center; }

    .link-accent { color: var(--accent); text-decoration: none; font-weight: 500; }
    .link-underline { cursor: pointer; color: var(--accent); font-weight: 500; text-decoration: underline; }
    .inline-flex-center { display: inline-flex; align-items: center; gap: 3px; }

    .icon-nav { width: 20px; height: 20px; flex-shrink: 0; }

    /* --- Additional Utilities (Phase 4.1) --- */
    .text-left { text-align: left; }
    .font-medium { font-weight: 500; }

    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-sm); }
    .stat-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); grid-template-rows: auto; }
    .grid-4col { grid-template-columns: repeat(4, 1fr); grid-template-rows: auto; }
    .stack-md { display: grid; gap: var(--space-md); }

    .grid-section-header {
        grid-column: 1 / -1;
        padding: var(--space-md) 0 var(--space-sm);
        font-size: var(--font-sm);
        font-weight: 600;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--divider);
        margin-top: var(--space-md);
    }

    .data-table { border-collapse: collapse; font-size: var(--font-sm); font-family: var(--font-mono); width: auto; }
    .data-table th,
    .data-table td { padding: 4px 10px; border: 1px solid var(--border-color); white-space: nowrap; }
    .data-table th { background: var(--bg-primary); font-weight: 600; }

    .content-table { width: 100%; border-collapse: collapse; margin: var(--space-md) 0; font-size: var(--font-sm); }

    .bar-track { border-radius: 2px; background: var(--border-color); overflow: hidden; position: relative; }
    .bar-track-sm { height: 4px; }
    .bar-track-md { height: 10px; }

/* ===== Accessibility ===== */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
.skip-link {
  position: absolute;
  top: -100%;
  left: var(--space-md);
  z-index: 10000;
  padding: var(--space-sm) var(--space-md);
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius-sm);
  font-weight: 600;
  text-decoration: none;
  transition: top 0.2s;
}
.skip-link:focus {
  top: var(--space-md);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

@media (forced-colors: active) {
  /* Ensure focus indicators use system colours */
  :focus-visible {
    outline: 2px solid Highlight;
    outline-offset: 2px;
  }

  /* Cards and panels need visible borders */
  .card,
  .kpi-card,
  .scenario-item,
  .req-tree-node,
  .req-detail-file-card,
  .filter-chip,
  .nav-item {
    border: 1px solid ButtonText;
  }

  /* Active/selected states use system highlight */
  .nav-item.active,
  .filter-chip.active,
  .req-tree-node--active {
    border-color: Highlight;
    outline: 2px solid Highlight;
  }

  /* Outcome bar segments need borders to be distinguishable */
  .req-tree-bars > div,
  .req-detail-outcome-bar > div {
    border: 1px solid ButtonText;
  }

  /* History dots and status icons */
  .history-dot,
  .kpi-dot {
    border: 1px solid ButtonText;
  }

  .history-dot--retried-success,
  .exec-history-dot--retried-success {
    background: ButtonFace !important;
    border: 1px solid ButtonText;
    position: relative;
    overflow: hidden;
  }

  .history-dot--retried-success::after,
  .exec-history-dot--retried-success::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 50%;
    height: 100%;
    background: ButtonText;
  }

  /* Badge visibility */
  .nav-badge,
  .badge,
  .tag-chip {
    border: 1px solid ButtonText;
  }

  /* Sparkline and chart elements */
  .sparkline-area polygon,
  .sparkline-area polyline {
    forced-color-adjust: none;
  }
}

/* About view */

.about-view .about-section-title {
    font-size: var(--font-lg);
    font-weight: 600;
    margin: 0 0 var(--space-md);
}

.about-view section {
    margin-bottom: var(--space-xl);
}

.glossary {
    font-size: var(--font-sm);
    margin: 0 0 var(--space-lg);
    display: grid;
    gap: var(--space-sm);
}

.glossary-group-title {
    font-size: var(--font-md);
    font-weight: 600;
    margin: var(--space-lg) 0 var(--space-sm);
    color: var(--text-primary);
}

.glossary-group-title:first-of-type {
    margin-top: 0;
}

.glossary-entry {
    padding: var(--space-sm) var(--space-md);
    background: var(--bg-primary);
    border-radius: var(--radius-sm);
}

.glossary-entry dt {
    font-weight: 600;
    margin-bottom: 2px;
}

.glossary-entry dd {
    margin: 0;
    color: var(--text-secondary);
}

/* Run details panel (selection-first chart interaction) */

.trend-chart-wrapper {
    position: relative;
}

/* Fade overlays indicating horizontal pan affordance on mobile */
.trend-chart-fade-left,
.trend-chart-fade-right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30px;
    pointer-events: none;
    z-index: 2;
    transition: opacity 0.3s ease;
    opacity: 0;
}

.trend-chart-fade-left {
    left: 0;
    background: linear-gradient(to right, var(--bg-card), transparent);
}

.trend-chart-fade-right {
    right: 0;
    background: linear-gradient(to left, var(--bg-card), transparent);
}

.trend-chart-fade-left.visible,
.trend-chart-fade-right.visible {
    opacity: 1;
}

.run-details-panel {
    margin-top: var(--space-md);
    padding: var(--space-md);
    background: var(--bg-primary);
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    animation: panel-appear 0.2s ease-out;
}

.run-details-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-md);
}

.run-details-title {
    font-size: var(--font-md);
    font-weight: 600;
    color: var(--text-primary);
}

.run-details-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: var(--font-md);
    color: var(--text-secondary);
    padding: var(--space-xs);
    border-radius: var(--radius-sm);
    line-height: 1;
}

.run-details-close:hover {
    color: var(--text-primary);
    background: var(--bg-secondary);
}

.run-details-metrics {
    display: flex;
    gap: var(--space-lg);
    margin-bottom: var(--space-md);
}

.run-details-metric {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.run-details-metric-value {
    font-size: var(--font-xl);
    font-weight: 700;
    line-height: 1.2;
}

.run-details-metric-label {
    font-size: var(--font-xs);
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.run-details-durations {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-xs) var(--space-lg);
    margin-bottom: var(--space-md);
    padding: var(--space-sm) 0;
    border-top: 1px solid var(--border-color);
}

.run-details-duration-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: var(--font-sm);
}

.run-details-duration-label {
    color: var(--text-secondary);
}

.run-details-duration-value {
    font-weight: 500;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
}

.run-details-cta {
    display: block;
    width: 100%;
    padding: var(--space-sm) var(--space-md);
    background: var(--color-primary, #696cff);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: var(--font-sm);
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s ease;
}

.run-details-cta:hover {
    opacity: 0.9;
}

.run-details-cta:focus-visible {
    outline: 2px solid var(--color-primary, #696cff);
    outline-offset: 2px;
}

@keyframes panel-appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile: bottom sheet variant */
@media (max-width: 768px) {
    .run-details-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        margin: 0;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.15);
        z-index: 100;
        animation: panel-slide-up 0.25s ease-out;
    }

    @keyframes panel-slide-up {
        from {
            opacity: 0;
            transform: translateY(100%);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
}

@media (prefers-reduced-motion: reduce) {
    .run-details-panel {
        animation: none;
    }
}

/* Mobile: breadcrumbs and tags single-line scroll */
@media (max-width: 768px) {
    .breadcrumb {
        white-space: nowrap;
    }

    .scenario-detail-tags {
        flex-wrap: nowrap;
    }
}

    <div class="about-view">
      <div class="card">
        <p style="margin:0 0 var(--space-lg)">
          This report is generated by <a href="https://serenity-js.org" target="_blank" class="link-accent">Serenity/JS</a>.
          It gives you a clear picture of what your test suite covers, where it's failing, and whether the system is ready to release.
        </p>

        <section>
          <h3 class="about-section-title">Confidence scoring</h3>
          <p>The confidence score is this report's primary quality indicator — a single number (0–100%) that answers:</p>
          <blockquote style="border-left:3px solid var(--accent);padding:var(--space-sm) var(--space-md);margin:var(--space-md) 0;color:var(--text-secondary);font-style:italic">
            "How confident am I that this capability works correctly?"
          </blockquote>
          <p>Confidence is a weighted composite of three signals:</p>
          <table class="content-table">
            <thead>
              <tr style="border-bottom:2px solid var(--divider)">
                <th class="panel-section font-semibold text-left">Signal</th>
                <th class="panel-section font-semibold text-left">Weight</th>
                <th class="panel-section font-semibold text-left">Measures</th>
              </tr>
            </thead>
            <tbody>
              <tr class="border-b">
                <td class="panel-section font-medium">Pass Rate</td>
                <td class="panel-section">40%</td>
                <td class="panel-section text-secondary">Percentage of scenarios passing among those executed (excludes skipped/pending)</td>
              </tr>
              <tr class="border-b">
                <td class="panel-section font-medium">Consistency</td>
                <td class="panel-section">35%</td>
                <td class="panel-section text-secondary">How stable the results are across recent runs — a test that alternates between passing and failing scores low</td>
              </tr>
              <tr class="border-b">
                <td class="panel-section font-medium">Completeness</td>
                <td class="panel-section">25%</td>
                <td class="panel-section text-secondary">Percentage of scenarios that are implemented (not pending or skipped)</td>
              </tr>
            </tbody>
          </table>
          <p>
            The formula is deterministic with no hidden penalties:
            <code style="background:var(--bg-primary);padding:2px 6px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:var(--font-xs)">
              Confidence = Pass Rate × 0.40 + Consistency × 0.35 + Completeness × 0.25
            </code>
          </p>
          <p>If all three metrics are 100%, confidence is 100%. In plain terms: passing tests matter most (40%), reliability across runs matters almost as much (35%), and having all tests implemented rather than pending or skipped accounts for the rest (25%).</p>
        </section>

        <section>
          <h3 class="about-section-title">Report sections</h3>

          <div class="stack-md">
            <div class="panel-bg">
              <h4 class="section-title-sm">Dashboard</h4>
              <p class="section-text">Overview of the latest test run — confidence, pass rate, consistency, completeness, duration, and trend across recent executions.</p>
            </div>
            <div class="panel-bg">
              <h4 class="section-title-sm">Test Scenarios</h4>
              <p class="section-text">Browse, search, and filter all test scenarios. View execution details, activity trees, screenshots, and retry history for each test.</p>
            </div>
            <div class="panel-bg">
              <h4 class="section-title-sm">Capabilities</h4>
              <p class="section-text">Hierarchical view of business capabilities, organised to match how your test files are structured. Each capability shows confidence, outcomes, and documentation from README files.</p>
            </div>
            <div class="panel-bg">
              <h4 class="section-title-sm">Errors</h4>
              <p class="section-text">Failed scenarios grouped by error type — assertion errors, timeouts, runtime errors, and compromised tests. Helps identify patterns in failures.</p>
            </div>
            <div class="panel-bg">
              <h4 class="section-title-sm">Consistency</h4>
              <p class="section-text">Tests with reliability issues across recent runs. Classifies tests based on their execution pattern:</p>
              <ul style="padding-left:var(--space-lg);margin:var(--space-sm) 0;font-size:var(--font-sm);color:var(--text-secondary);line-height:1.8">
                <li><strong>Flaky</strong> — fails on the first attempt but passes after a retry within the same run. The build goes green, but the test needed multiple tries to get there.</li>
                <li><strong>Inconsistent</strong> — has genuine failures in its recent history but currently survives only via retry. The build passes, but the test has broken before and may again.</li>
                <li><strong>Degraded</strong> — was passing in the previous run, now failing.</li>
                <li><strong>Recovered</strong> — was failing in the previous run, now passes cleanly without needing retry.</li>
              </ul>
            </div>
            <div class="panel-bg">
              <h4 class="section-title-sm">Timeline</h4>
              <p class="section-text">Execution timeline showing when each scenario ran and how long it took. Useful for identifying slow tests and optimising execution time.</p>
            </div>
            <div class="panel-bg">
              <h4 class="section-title-sm">Test Runs</h4>
              <p class="section-text">History of all test executions with trend analysis. Compare results across runs to identify regressions or improvements over time.</p>
            </div>
            <div class="panel-bg">
              <h4 class="section-title-sm">Machine-Readable Summary</h4>
              <p class="section-text">A machine-readable <a href="summary.json" target="_blank" class="link-accent">summary.json</a> file is generated alongside the report. It contains the same quality data (outcomes, failure patterns, consistency scores) in a format that CI pipelines, dashboards, and AI tools can consume automatically.</p>
            </div>
          </div>
        </section>

        <section>
          <h3 class="about-section-title">Improving confidence</h3>
          <p>To increase the confidence score for a capability:</p>
          <ul style="padding-left:var(--space-lg);margin:var(--space-sm) 0;font-size:var(--font-sm);color:var(--text-secondary);line-height:1.8">
            <li><strong>Fix failing tests</strong> — each failure directly reduces the pass rate component</li>
            <li><strong>Implement pending scenarios</strong> — unimplemented tests reduce completeness</li>
            <li><strong>Stabilise inconsistent tests</strong> — inconsistent outcomes reduce the consistency component</li>
            <li><strong>Run tests regularly</strong> — more execution history gives consistency a stronger signal</li>
          </ul>
        </section>

        <section>
          <h3 class="about-section-title">Glossary</h3>

          <h4 class="glossary-group-title">Screenplay Pattern</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Actor</dt>
              <dd>A person or external system interacting with the system under test. Actors perform Tasks and Interactions using their Abilities (e.g. <em>BrowseTheWeb</em>, <em>CallAnApi</em>).</dd>
            </div>
            <div class="glossary-entry">
              <dt>Ability</dt>
              <dd>A thin wrapper around an interface to the system under test (e.g. a browser, an HTTP client, a database connection). Actors are given Abilities so they can perform Interactions.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Task</dt>
              <dd>A business-meaningful workflow composed of other Tasks and Interactions. Shown as bold entries in the activity tree (e.g. "Alice places an order").</dd>
            </div>
            <div class="glossary-entry">
              <dt>Interaction</dt>
              <dd>A single, atomic action at the system interface level (e.g. "Alice clicks on submit button", "Alice sends a POST request"). The leaf nodes in the activity tree.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Question</dt>
              <dd>A way to read information from the system under test — for example, "the text of the heading" or "the status of the last response." Questions don't change anything; they only observe. They're used in assertions to verify expected behaviour.</dd>
            </div>
          </dl>

          <h4 class="glossary-group-title">Test scenario outcomes</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Passed</dt>
              <dd>A test scenario that completed successfully — all assertions were satisfied.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Failed</dt>
              <dd>A test scenario where an assertion was not satisfied (e.g. expected value did not match actual).</dd>
            </div>
            <div class="glossary-entry">
              <dt>Error</dt>
              <dd>A test scenario that failed due to an unexpected error (e.g. an unhandled exception) rather than an assertion failure.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Compromised</dt>
              <dd>A test that could not complete because something in the test environment failed (e.g. database unavailable, network timeout) — not because of a bug in the product being tested.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Pending</dt>
              <dd>A test scenario that has been specified but not yet implemented — a placeholder for future work.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Skipped</dt>
              <dd>A test scenario that was intentionally excluded from execution (e.g. via a tag filter or conditional skip).</dd>
            </div>
          </dl>

          <h4 class="glossary-group-title">Quality metrics</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Confidence</dt>
              <dd>A composite score (0–100%) indicating how likely a capability is to be working correctly. Combines pass rate, completeness, and consistency.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Pass Rate</dt>
              <dd>The percentage of executed scenarios that are currently passing. Excludes pending and skipped scenarios from the calculation.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Completeness</dt>
              <dd>The percentage of scenarios that are implemented and actively executed (not pending or skipped).</dd>
            </div>
            <div class="glossary-entry">
              <dt>Consistency</dt>
              <dd>How repeatable a test's outcome is across recent runs. A test that alternates between passing and failing has low consistency (colloquially known as "flaky").</dd>
            </div>
            <div class="glossary-entry">
              <dt>Consistency Window</dt>
              <dd>The number of most recent test runs considered when evaluating consistency (default: 5). Only runs within this window affect the consistency score.</dd>
            </div>
          </dl>

          <h4 class="glossary-group-title">Test history</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Flaky</dt>
              <dd>A test that fails on an earlier attempt but passes on a subsequent retry within a single test run. The build succeeds, but the test needed multiple tries to get there.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Inconsistent</dt>
              <dd>A test that has genuine failures in its recent history but whose most recent outcome is a pass-on-retry. The build stays green only because retries are masking the underlying problem.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Degraded</dt>
              <dd>A test that was passing in the previous run but is now failing — a new regression that needs attention.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Recovered</dt>
              <dd>A test that was failing in the previous run but now passes cleanly on the first attempt. A test that now passes only via retry is "flaky", not "recovered".</dd>
            </div>
          </dl>

          <h4 class="glossary-group-title">Living documentation</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Capability</dt>
              <dd>A grouping of test scenarios derived from your spec directory structure. Each directory becomes a capability node; README files provide documentation for each capability.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Activity Tree</dt>
              <dd>The hierarchical breakdown of a scenario's execution — showing the Tasks and Interactions performed, their outcomes, durations, and any associated artifacts (screenshots, HTTP exchanges).</dd>
            </div>
          </dl>
        </section>

        <section>
          <h3 class="about-section-title">Learn more</h3>
          <p>
            Visit <a href="https://serenity-js.org/handbook/reporting/" target="_blank" class="link-accent">serenity-js.org/handbook/reporting</a> for
            comprehensive documentation on configuring reporters, customising reports, and integrating Serenity/JS into your CI/CD pipeline.
          </p>
        </section>
      </div>
