    <div class="about-view">
      <div class="card">
        <p style="color:var(--text-secondary);margin:0 0 var(--space-lg)">
          This report is generated by <a href="https://serenity-js.org" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:500">Serenity/JS</a> and provides living documentation of your test suite,
          combining executable specifications with quality analytics to help you make informed release decisions.
        </p>

        <section>
          <h3 class="about-section-title">Confidence scoring</h3>
          <p>Confidence is the primary quality metric in this report. It answers the question:</p>
          <blockquote style="border-left:3px solid var(--accent);padding:var(--space-sm) var(--space-md);margin:var(--space-md) 0;color:var(--text-secondary);font-style:italic">
            "How much should I trust this capability?"
          </blockquote>
          <p>Confidence is a weighted composite of three signals:</p>
          <table style="width:100%;border-collapse:collapse;margin:var(--space-md) 0;font-size:var(--font-sm)">
            <thead>
              <tr style="border-bottom:2px solid var(--divider)">
                <th style="text-align:left;padding:var(--space-sm) var(--space-md);font-weight:600">Signal</th>
                <th style="text-align:left;padding:var(--space-sm) var(--space-md);font-weight:600">Weight</th>
                <th style="text-align:left;padding:var(--space-sm) var(--space-md);font-weight:600">Measures</th>
              </tr>
            </thead>
            <tbody>
              <tr style="border-bottom:1px solid var(--divider)">
                <td style="padding:var(--space-sm) var(--space-md);font-weight:500">Pass Rate</td>
                <td style="padding:var(--space-sm) var(--space-md)">40%</td>
                <td style="padding:var(--space-sm) var(--space-md);color:var(--text-secondary)">Percentage of scenarios passing among those executed (excludes skipped/pending)</td>
              </tr>
              <tr style="border-bottom:1px solid var(--divider)">
                <td style="padding:var(--space-sm) var(--space-md);font-weight:500">Consistency</td>
                <td style="padding:var(--space-sm) var(--space-md)">35%</td>
                <td style="padding:var(--space-sm) var(--space-md);color:var(--text-secondary)">Repeatability across recent executions — how often outcomes change between runs</td>
              </tr>
              <tr style="border-bottom:1px solid var(--divider)">
                <td style="padding:var(--space-sm) var(--space-md);font-weight:500">Completeness</td>
                <td style="padding:var(--space-sm) var(--space-md)">25%</td>
                <td style="padding:var(--space-sm) var(--space-md);color:var(--text-secondary)">Percentage of scenarios that are implemented (not pending or skipped)</td>
              </tr>
            </tbody>
          </table>
          <p style="font-size:var(--font-sm);color:var(--text-secondary)">
            The formula is deterministic with no hidden penalties:
            <code style="background:var(--bg-primary);padding:2px 6px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:var(--font-xs)">
              Confidence = Pass Rate × 0.40 + Completeness × 0.25 + Consistency × 0.35
            </code>
          </p>
          <p style="font-size:var(--font-sm);color:var(--text-secondary)">If all three metrics are 100%, confidence is 100%.</p>
        </section>

        <section>
          <h3 class="about-section-title">Report sections</h3>

          <div style="display:grid;gap:var(--space-md)">
            <div style="padding:var(--space-md);background:var(--bg-primary);border-radius:var(--radius-sm)">
              <h4 style="margin:0 0 var(--space-xs);font-weight:600">Dashboard</h4>
              <p style="margin:0;font-size:var(--font-sm);color:var(--text-secondary)">Overview of the latest test run — confidence, pass rate, consistency, completeness, duration, and trend across recent executions.</p>
            </div>
            <div style="padding:var(--space-md);background:var(--bg-primary);border-radius:var(--radius-sm)">
              <h4 style="margin:0 0 var(--space-xs);font-weight:600">Test Scenarios</h4>
              <p style="margin:0;font-size:var(--font-sm);color:var(--text-secondary)">Browse, search, and filter all test scenarios. View execution details, activity trees, screenshots, and retry history for each test.</p>
            </div>
            <div style="padding:var(--space-md);background:var(--bg-primary);border-radius:var(--radius-sm)">
              <h4 style="margin:0 0 var(--space-xs);font-weight:600">Capabilities</h4>
              <p style="margin:0;font-size:var(--font-sm);color:var(--text-secondary)">Hierarchical view of business capabilities derived from your test directory structure. Each capability shows confidence, outcomes, and documentation from README files.</p>
            </div>
            <div style="padding:var(--space-md);background:var(--bg-primary);border-radius:var(--radius-sm)">
              <h4 style="margin:0 0 var(--space-xs);font-weight:600">Errors</h4>
              <p style="margin:0;font-size:var(--font-sm);color:var(--text-secondary)">Failed scenarios grouped by error type — assertion errors, timeouts, runtime errors, and compromised tests. Helps identify patterns in failures.</p>
            </div>
            <div style="padding:var(--space-md);background:var(--bg-primary);border-radius:var(--radius-sm)">
              <h4 style="margin:0 0 var(--space-xs);font-weight:600">Consistency</h4>
              <p style="margin:0;font-size:var(--font-sm);color:var(--text-secondary)">Tests with inconsistent outcomes across recent runs. Identifies flaky tests that pass and fail unpredictably, undermining confidence in your test suite.</p>
            </div>
            <div style="padding:var(--space-md);background:var(--bg-primary);border-radius:var(--radius-sm)">
              <h4 style="margin:0 0 var(--space-xs);font-weight:600">Timeline</h4>
              <p style="margin:0;font-size:var(--font-sm);color:var(--text-secondary)">Execution timeline showing when each scenario ran and how long it took. Useful for identifying slow tests and optimising execution time.</p>
            </div>
            <div style="padding:var(--space-md);background:var(--bg-primary);border-radius:var(--radius-sm)">
              <h4 style="margin:0 0 var(--space-xs);font-weight:600">Test Runs</h4>
              <p style="margin:0;font-size:var(--font-sm);color:var(--text-secondary)">History of all test executions with trend analysis. Compare results across runs to identify regressions or improvements over time.</p>
            </div>
          </div>
        </section>

        <section>
          <h3 class="about-section-title">Improving confidence</h3>
          <p>To increase the confidence score for a capability:</p>
          <ul style="padding-left:var(--space-lg);margin:var(--space-sm) 0;font-size:var(--font-sm);color:var(--text-secondary);line-height:1.8">
            <li><strong>Fix failing tests</strong> — each failure directly reduces the pass rate component</li>
            <li><strong>Implement pending scenarios</strong> — unimplemented tests reduce completeness</li>
            <li><strong>Stabilise flaky tests</strong> — inconsistent outcomes reduce the consistency component</li>
            <li><strong>Run tests regularly</strong> — more execution history gives consistency a stronger signal</li>
          </ul>
        </section>

        <section>
          <h3 class="about-section-title">Glossary</h3>

          <h4 class="glossary-group-title">Screenplay Pattern</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Actor</dt>
              <dd>A person or external system interacting with the system under test. Actors perform Tasks and Interactions using their Abilities (e.g. <em>BrowseTheWeb</em>, <em>CallAnApi</em>).</dd>
            </div>
            <div class="glossary-entry">
              <dt>Ability</dt>
              <dd>A thin wrapper around an interface to the system under test (e.g. a browser, an HTTP client, a database connection). Actors are given Abilities so they can perform Interactions.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Task</dt>
              <dd>A business-meaningful workflow composed of other Tasks and Interactions. Shown as bold entries in the activity tree (e.g. "Alice places an order").</dd>
            </div>
            <div class="glossary-entry">
              <dt>Interaction</dt>
              <dd>A single, atomic action at the system interface level (e.g. "Alice clicks on submit button", "Alice sends a POST request"). The leaf nodes in the activity tree.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Question</dt>

          <h4 class="glossary-group-title">Test scenario outcomes</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Passed</dt>
              <dd>A test scenario that completed successfully — all assertions were satisfied.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Failed</dt>
              <dd>A test scenario where an assertion was not satisfied (e.g. expected value did not match actual).</dd>
            </div>
            <div class="glossary-entry">
              <dt>Error</dt>
              <dd>A test scenario that failed due to an unexpected error (e.g. an unhandled exception) rather than an assertion failure.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Compromised</dt>
              <dd>A test that could not complete due to an infrastructure failure (e.g. database unavailable, network timeout) rather than a defect in the system under test.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Pending</dt>
              <dd>A test scenario that has been specified but not yet implemented — a placeholder for future work.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Skipped</dt>
              <dd>A test scenario that was intentionally excluded from execution (e.g. via a tag filter or conditional skip).</dd>
            </div>
          </dl>

          <h4 class="glossary-group-title">Quality metrics</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Confidence</dt>
              <dd>A composite score (0–100%) indicating how trustworthy a capability's test coverage is. Combines pass rate, completeness, and consistency.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Pass Rate</dt>
              <dd>The percentage of executed scenarios that are currently passing. Excludes pending and skipped scenarios from the calculation.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Completeness</dt>
              <dd>The percentage of scenarios that are implemented and actively executed (not pending or skipped).</dd>
            </div>
            <div class="glossary-entry">
              <dt>Consistency</dt>
              <dd>How repeatable a test's outcome is across recent runs. A test that alternates between passing and failing has low consistency (sometimes called "flaky").</dd>
            </div>
            <div class="glossary-entry">
              <dt>Consistency Window</dt>
              <dd>The number of most recent test runs considered when evaluating consistency (default: 5). Only runs within this window affect the consistency score.</dd>
            </div>
          </dl>

          <h4 class="glossary-group-title">Test history</h4>
          <dl class="glossary">
            <div class="glossary-entry">
              <dt>Degraded</dt>
              <dd>A test that passed in the previous run but fails in the current run — a new regression that needs attention.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Recovered</dt>
              <dd>A test that failed in the previous run but passes in the current run — a fixed regression.</dd>
            </div>
            <div class="glossary-entry">
              <dt>Inconsistent</dt>
              <dd>A test whose outcome has changed between passing and failing within the consistency window, indicating non-deterministic behaviour.</dd>
            </div>
          </dl>

          <h4 class="glossary-group-title">Living documentation</h4>
          <dl class="glossary">
            <div class="glossary-entry">

            </div>
            <div class="glossary-entry">

              <dd>The hierarchical breakdown of a scenario's execution — showing the Tasks and Interactions performed, their outcomes, durations, and any associated artifacts (screenshots, HTTP exchanges).</dd>
            </div>
          </dl>
