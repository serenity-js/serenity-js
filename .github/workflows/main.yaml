name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish the missing packages of, e.g. v3.49.0'
        required: true
        type: string

permissions:
  contents: read

jobs:

  lint:
    name: 'Lint'
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
      - name: Lint
        run: make lint

  compile:
    name: 'Compile'
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
      - name: Compile
        run: make COMPILE_SCOPE=libs compile
      - name: Upload compiled libs
        uses: ./.github/actions/upload-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
          artifact-path: 'package.json "integration/*/lib/*" "integration/*/esm/*" "packages/*/lib/*" "packages/*/esm/*" "packages/serenity-bdd/cache/*"'

  #
  # Test
  #

  test-linux-node-lts-active:
    name: 'Test: Linux, LTS'
    needs:
      - lint
      - compile
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    permissions:
      checks: write
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
        with:
          browsers: 'protractor'
      - name: Download compiled libs
        uses: ./.github/actions/download-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
      - name: Test
        run: make test
      - name: Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          command: publish
          files: packages/*/target/coverage/lcov.info
          incomplete: true

  test-linux-node-lts-maintenance:
    name: 'Test: Linux, LTS-1'
    needs:
      - lint
      - compile
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node
        with:
          node-version: 22.23.3
      - name: Download compiled libs
        uses: ./.github/actions/download-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
      - name: Test
        run: make test-no-coverage

  test-windows-node-lts-active:
    name: 'Test: Windows, LTS'
    needs:
      - lint
      - compile
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Download compiled libs
        uses: ./.github/actions/download-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
      - name: Test
        run: make test-no-coverage

  #
  # Integration
  #

  test-integration-playwright:
    name: 'Integration: Playwright'
    needs:
      - lint
      - compile
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    permissions:
      checks: write
      contents: read
      id-token: write
    strategy:
      matrix:
        module:
          - html-reporter
          - playwright-electron
          - playwright-test
          - playwright-test-ct
          - playwright-web
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
      - name: Set up Java
        uses: ./.github/actions/setup-java
      - name: Download compiled libs
        uses: ./.github/actions/download-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
      - name: Test
        run: |
          mkdir target && \
          make INTEGRATION_SCOPE=${{ matrix.module }} integration-test
      - name: Upload html-report data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'html-report-data-${{ matrix.module }}-attempt-${{ github.run_attempt }}'
          path: integration/*/target/html-report/test-runs/
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: ./.github/actions/upload-compressed-artifact
        with:
          artifact-name: 'test-integration-reports-${{ matrix.module }}'
          artifact-path: 'package.json "integration/*/target/site/serenity"'
      - name: Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          command: publish
          files: integration/*/target/coverage/lcov.info
          incomplete: true

  test-integration-protractor:
    name: 'Integration: Protractor'
    needs:
      - lint
      - compile
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    permissions:
      checks: write
      contents: read
      id-token: write
    strategy:
      matrix:
        module:
          - protractor-test-runners
          - protractor-web
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
        with:
          browsers: 'protractor'
      - name: Set up Java
        uses: ./.github/actions/setup-java
      - name: Download compiled libs
        uses: ./.github/actions/download-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
      - name: Test
        run: |
          mkdir target && \
          make INTEGRATION_SCOPE=${{ matrix.module }} integration-test
      - name: Upload html-report data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'html-report-data-${{ matrix.module }}-attempt-${{ github.run_attempt }}'
          path: integration/*/target/html-report/test-runs/
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: ./.github/actions/upload-compressed-artifact
        with:
          artifact-name: 'test-integration-reports-${{ matrix.module }}'
          artifact-path: 'package.json "integration/*/target/site/serenity"'
      - name: Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          command: publish
          files: integration/*/target/coverage/lcov.info
          incomplete: true

  test-integration-webdriverio:
    name: 'Integration: WebdriverIO'
    needs:
      - lint
      - compile
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    permissions:
      checks: write
      contents: read
      id-token: write
    strategy:
      matrix:
        module:
          - webdriverio-8-test-runners
          - webdriverio-8-web-devtools
          - webdriverio-8-web-webdriver
          - webdriverio-test-runners
          - webdriverio-web
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
        with:
          browsers: 'webdriverio'
      - name: Set up Java
        uses: ./.github/actions/setup-java
      - name: Download compiled libs
        uses: ./.github/actions/download-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
      - name: Test
        run: |
          mkdir target && \
          make INTEGRATION_SCOPE=${{ matrix.module }} integration-test
      - name: Upload html-report data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'html-report-data-${{ matrix.module }}-attempt-${{ github.run_attempt }}'
          path: integration/*/target/html-report/test-runs/
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: ./.github/actions/upload-compressed-artifact
        with:
          artifact-name: 'test-integration-reports-${{ matrix.module }}'
          artifact-path: 'package.json "integration/*/target"'
      - name: Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          command: publish
          files: integration/*/target/coverage/lcov.info
          incomplete: true

  test-integration:
    name: 'Integration'
    needs:
      - lint
      - compile
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    permissions:
      checks: write
      contents: read
      id-token: write
    strategy:
      matrix:
        module:
          - cucumber-1
          - cucumber-2
          - cucumber-3
          - cucumber-4
          - cucumber-5
          - cucumber-6
          - cucumber-7
          - cucumber-8
          - cucumber-9
          - cucumber-10
          - cucumber-11
          - cucumber-12
          - cucumber-13
          - jasmine
          - jasmine-5
          - mocha
          - rest
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
      - name: Download compiled libs
        uses: ./.github/actions/download-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
      - name: Test
        run: |
          mkdir target && \
          make INTEGRATION_SCOPE=${{ matrix.module }} integration-test
      - name: Upload html-report data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'html-report-data-${{ matrix.module }}-attempt-${{ github.run_attempt }}'
          path: integration/*/target/html-report/test-runs/
          retention-days: 3
          if-no-files-found: ignore
      - name: Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          command: publish
          files: integration/*/target/coverage/lcov.info
          incomplete: true

  #
  # Reporting
  #

  coverage:
    name: 'Coverage'
    needs:
      - test-linux-node-lts-active
      - test-integration
      - test-integration-playwright
      - test-integration-protractor
      - test-integration-webdriverio
    runs-on: ubuntu-26.04
    permissions:
      checks: write
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          command: complete

  #
  # NPM artifact publishing
  #

  html-report:
    name: 'HTML Report: aggregate'
    if: "!cancelled() && !contains(needs.*.result, 'skipped')"
    permissions:
      contents: write
    needs:
      - test-integration
      - test-integration-playwright
      - test-integration-protractor
      - test-integration-webdriverio
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
      - name: Download compiled libs
        uses: ./.github/actions/download-compressed-artifact
        with:
          artifact-name: 'compiled-libs'
      - name: Restore historical test runs from GitHub Pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: target/html-report
        continue-on-error: true
      - name: Download html-report data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: 'html-report-data-*'
          path: target/html-report-data
      - name: Generate report
        run: |
          pnpm run report:html -- aggregate \
            --input "target/html-report-data/**/test-runs/*,target/html-report/test-runs/*" \
            --output ./target/html-report \
            --title "Serenity/JS Integration Tests" \
            --spec-dir integration \
            --max-history 5
      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'html-report'
          path: target/html-report/
          retention-days: 14
      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: target/html-report
          clean: true

  artifacts-publish:
    name: 'NPM: publish artifacts'
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    needs:
      - test-linux-node-lts-active
      - test-linux-node-lts-maintenance
      - test-windows-node-lts-active
      - test-integration
      - test-integration-playwright
      - test-integration-protractor
      - test-integration-webdriverio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
      - uses: ./.github/actions/setup-lerna
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_user_email: ${{ secrets.RELEASE_GH_EMAIL }}
          git_username: ${{ secrets.RELEASE_GH_USERNAME }}

      - name: Download compiled libs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compiled-libs
      - name: Decompress Libs
        run: 7z x -aoa compiled-libs.zip

      - name: Version packages
        run: pnpm lerna:version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing is separate from versioning, so that a failed publish can be retried,
      # in this job or later via workflow_dispatch, without creating a new version.
      - name: Publish artifacts
        shell: bash
        run: bin/lerna-publish-with-retry.sh 3

      - name: Print versions
        run: pnpm version:print >> $GITHUB_STEP_SUMMARY

  # Publishes the packages of an existing release that didn't make it to npm,
  # for example after an intermittent registry or transparency log failure.
  # Run it from the Actions tab: "Main" → "Run workflow" → tag, e.g. v3.49.0
  artifacts-republish:
    name: 'NPM: publish missing artifacts'
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/serenity-js/playwright:v1.64.0-resolute
    steps:
      - name: Validate tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag, expected something like v3.49.0"
            exit 1
          fi
      # The release tag might predate the retry script, so keep the copy from this workflow's commit
      - name: Check out release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: bin/lerna-publish-with-retry.sh
          sparse-checkout-cone-mode: false
      - name: Keep release tools
        shell: bash
        run: cp bin/lerna-publish-with-retry.sh "$RUNNER_TEMP/"
      - name: Check out the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      # npm moves the `latest` dist-tag to whatever gets published, unless told otherwise.
      # Packages missing from an older release are published under `backfill` instead,
      # so that `latest` keeps pointing to the newest release.
      - name: Choose npm dist-tag
        id: dist-tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$TAG" = "$newest" ]; then
            echo "options=" >> "$GITHUB_OUTPUT"
            echo "$TAG is the newest release, publishing under the 'latest' dist-tag"
          else
            echo "options=--dist-tag backfill" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is older than $newest, publishing under the 'backfill' dist-tag so that 'latest' stays at $newest"
          fi
      - name: Set up Node
        uses: ./.github/actions/setup-node-container
      - name: Compile
        run: make COMPILE_SCOPE=libs compile
      - name: Publish missing artifacts
        shell: bash
        run: '"$RUNNER_TEMP/lerna-publish-with-retry.sh" 3 ${{ steps.dist-tag.outputs.options }}'
