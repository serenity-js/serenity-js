packages:
  - examples/*
  - integration/*
  - packages/*
overrides:
  # yauzl@2.x uses fd-slicer@1.x which has a broken stream lifecycle on Node.js >= 24.16.0,
  # causing extract-zip to silently fail on large files. See electron/electron#51619
  yauzl: ^3.4.0
linkWorkspacePackages: deep
hoistWorkspacePackages: true
disallowWorkspaceCycles: true
hoistPattern:
  - '!@types/cucumber'
  - '!@cucumber/*'
  - '!cucumber'
  - '!gherkin'
  - '!@types/jasmine'
  - '!jasmine'
  - '!webdriverio'
  - '!@wdio/*'
  - '!protractor'
  - '!selenium-webdriver'
allowBuilds:
  chromedriver: true
  cucumber-expressions: true
  electron: true
  nx: true
  core-js: false
  core-js-pure: false
  dtrace-provider: false
  edgedriver: false
  es5-ext: false
  esbuild: false
  geckodriver: false
minimumReleaseAge: 1440       # 1 day, in minutes
minimumReleaseAgeExclude:
  - eslint@10.5.0
  - "@serenity-js/*"
  - "playwright"
  - "@playwright/*"
  - "typescript"
  - "eslint"
  - "@typescript-eslint/*"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600 # 1 year, in minutes
trustPolicyExclude:
  - "@wdio/logger@9.18.0" # dep of edgedriver
  - "ua-parser-js@1.0.41" # dep of wdio8
blockExoticSubdeps: true